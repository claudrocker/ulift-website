server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Assets de Astro (_astro/*.js, *.css) llevan un hash de contenido en el
    # nombre de archivo: un cambio en el código genera un archivo con nombre
    # distinto, nunca sobrescribe uno existente. Por eso es seguro cachearlos
    # "para siempre" en el navegador.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # El HTML de cada página SÍ cambia de contenido sin cambiar de nombre
    # (index.html sigue llamándose igual en cada deploy). "no-cache" no
    # significa "no guardar": el navegador igual guarda una copia, pero
    # revalida contra el servidor en cada visita (petición condicional barata
    # vía ETag/Last-Modified) antes de usarla, así que un deploy nuevo se ve
    # de inmediato sin necesitar Cmd+R / Ctrl+F5.
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Resto de estáticos (favicon, imágenes en public/img/, etc.): no llevan
    # hash en el nombre y en este proyecto se reemplazan o renombran a mano
    # (ver historial de cambios de fotos), así que un cache largo tipo
    # "immutable" podría dejar mostrando una foto vieja tras un reemplazo.
    # Cache corto + revalidación obligatoria es el balance más seguro acá.
    location / {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri $uri/ =404;
    }
}
